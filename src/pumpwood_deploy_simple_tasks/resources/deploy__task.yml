apiVersion : "apps/v1"
kind: Deployment
metadata:
  name: pumpwood-task--{image}
spec:
  replicas: {replicas}
  selector:
    matchLabels:
      type: task
      endpoint: pumpwood-task--{image}
  template:
    metadata:
      labels:
        type: task
        endpoint: pumpwood-task--{image}
    spec:
      imagePullSecrets:
        - name: dockercfg
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: function
                operator: NotIn
                values:
                - system
      containers:
      - name: pumpwood-task--{image}
        image: {repository}/{image}:{version}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "{requests_memory}"
            cpu:  "{requests_cpu}"
          limits:
            memory: "{limits_memory}"
            cpu:  "{limits_cpu}"
        env:
        ###################
        # DEFAULT CONFIGS #
        - name: HASH_SALT
          valueFrom:
            secretKeyRef:
              name: general-secrets
              key: hash_salt
        - name: PUMPWOOD_COMMUNICATION__CRYPTO_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: general-secrets
              key: crypto_fernet_key

        # RABBITMQ ETL
        - name: RABBITMQ_HOST
          value: "rabbitmq-main"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-main-secrets
              key: password

        # Microsservice
        - name: MICROSERVICE_USERNAME
          valueFrom:
            secretKeyRef:
              name: pumpwood-task--{image}
              key: microservice_username
        - name: MICROSERVICE_PASSWORD
          valueFrom:
              secretKeyRef:
                name: pumpwood-task--{image}
                key: microservice_password
