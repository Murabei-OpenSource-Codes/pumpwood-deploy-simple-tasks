apiVersion : "apps/v1"
kind: Deployment
metadata:
  name: pumpwood-task--{image}
spec:
  replicas: {replicas}
  selector:
    matchLabels:
      type: task
      endpoint: pumpwood-task--{image}
  template:
    metadata:
      labels:
        type: task
        endpoint: pumpwood-task--{image}
    spec:
      imagePullSecrets:
        - name: dockercfg
      volumes:
      - name: gcp--storage-key
        secret:
          secretName: gcp--storage-key
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: function
                operator: NotIn
                values:
                - system
      containers:
      - name: pumpwood-task--{image}
        image: {repository}/{image}:{version}
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "{requests_memory}"
            cpu:  "{requests_cpu}"
          limits:
            memory: "{limits_memory}"
            cpu:  "{limits_cpu}"
        volumeMounts:
          - name: gcp--storage-key
            readOnly: true
            mountPath: /etc/secrets
        env:
        ###################
        # DEFAULT CONFIGS #
        - name: HASH_SALT
          valueFrom:
            secretKeyRef:
              name: general-secrets
              key: hash_salt
        - name: PUMPWOOD_COMMUNICATION__CRYPTO_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: general-secrets
              key: crypto_fernet_key

        # RABBITMQ ETL
        - name: RABBITMQ_HOST
          value: "rabbitmq-main"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-main-secrets
              key: password

        # Microsservice
        - name: MICROSERVICE_USERNAME
          valueFrom:
            secretKeyRef:
              name: pumpwood-task--{image}
              key: microservice_username
        - name: MICROSERVICE_PASSWORD
          valueFrom:
              secretKeyRef:
                name: pumpwood-task--{image}
                key: microservice_password

        ###########
        # STORAGE #
        - name: STORAGE_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: storage
              key: bucket_name
        - name: STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: storage
              key: storage_type

        # GCP
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/secrets/key-storage.json"
        # AZURE
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure--storage-key
              key: azure_storage_connection_string
        # AWS
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws--storage-key
              key: aws_access_key_id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws--storage-key
              key: aws_secret_access_key
              optional: true